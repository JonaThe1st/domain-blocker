name: tests

on:
  push:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests (JVM)
        run: ./gradlew test --no-daemon
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Check KVM availability
        run: ls -la /dev/kvm || echo "NO_KVM (software emulation)"
      - name: Emulator run (service + DNS + stability)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          profile: pixel_6
          disable-animations: true
          boot-timeout: 1500
          script: bash .github/scripts/emulator-test.sh
      - name: Upload logcat + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            /tmp/logcat.txt
            /tmp/01_enabled.png
            /tmp/02_stability.png
          if-no-files-found: warn
