name: tests

# Test pipeline:
#  - unit:   JVM unit tests (DNS codec, matcher, redirect server) — REQUIRED.
#  - emulator: end-to-end smoke/stability on an Android emulator. OPTIONAL:
#    GitHub-hosted runners currently expose no KVM to the build user, so the
#    emulator boots in pure software mode (very slow / flaky). It runs but its
#    result does not fail the workflow. Run locally on a KVM-capable machine
#    with `bash .github/scripts/emulator-test.sh` after starting a device,
#    or invoke this workflow manually (`workflow_dispatch`).
on:
  push:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests (JVM)
        run: ./gradlew test --no-daemon
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-latest
    continue-on-error: true   # OPTIONAL: see header comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Check KVM availability
        run: ls -la /dev/kvm || echo "NO_KVM (software emulation)"
      - name: Emulator run (service + DNS + stability)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1800
          script: bash .github/scripts/emulator-test.sh
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: /tmp/logcat.txt
          if-no-files-found: warn
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: |
            /tmp/*.png
          if-no-files-found: warn
